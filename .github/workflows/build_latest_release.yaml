name: build-latest-nunaliit-release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-nunaliit-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          java-package: 'jdk'
          check-latest: true
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Nunaliit with Maven
        run: mvn clean install
      - name: Get latest tag across main branch
        run: |
          git fetch --tags
          echo "LATEST_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      - name: Create release with GitHub CLI
        run: |
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release delete "$LATEST_TAG" --yes
          fi
          gh release create $LATEST_TAG nunaliit2-couch-sdk/target/*.tar.gz nunaliit2-couch-sdk/target/*.zip --notes "" --latest --target main --verify-tag 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
